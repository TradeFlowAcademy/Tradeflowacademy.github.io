<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061321">

  <title>Trading Journal | TradeFlow Academy</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .brand-header {
      background: #061321;
      border-bottom: 1px solid #203244;
      padding: 24px 5%;
    }

    .brand-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 16px;
    }

    .brand-name {
      color: #fff;
      font-size: clamp(22px, 5vw, 38px);
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-name span {
      color: #28d7b0;
    }

    .brand-tagline {
      color: #aebbc8;
      letter-spacing: 2px;
      font-size: 13px;
      margin-top: 7px;
    }

    .main-nav {
      background: #071827;
      border-bottom: 1px solid #203244;
      padding: 18px 5%;
    }

    .main-nav-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .main-nav a {
      color: #d5dee7;
      text-decoration: none;
      padding: 12px 17px;
      border-radius: 10px;
      font-weight: 700;
    }

    .main-nav a:hover,
    .main-nav a.active {
      background: #103044;
      color: #28d7b0;
    }

    .journal-hero {
      background:
        radial-gradient(circle at 85% 30%, rgba(40,215,176,.10), transparent 35%),
        linear-gradient(135deg, #061321, #102438);
      padding: 75px 5%;
    }

    .journal-hero-inner {
      max-width: 1100px;
      margin: auto;
    }

    .journal-hero h1 {
      font-size: clamp(38px, 7vw, 64px);
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin: 18px 0;
    }

    .journal-hero h1 span {
      color: #28d7b0;
    }

    .journal-hero p.lead {
      max-width: 700px;
    }

    .journal-content {
      background: #f3f6fa;
      color: #142033;
      padding: 65px 5%;
    }

    .journal-content-inner {
      max-width: 900px;
      margin: auto;
    }

    .journal-content h2 {
      font-size: clamp(30px, 5vw, 44px);
      margin-bottom: 10px;
    }

    .intro {
      color: #667184;
      margin-bottom: 30px;
    }

    .form-card {
      background: #fff;
      padding: clamp(20px, 5vw, 38px);
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(10, 25, 45, .08);
      margin-bottom: 35px;
    }

    .form-card h3 {
      color: #16b98d;
      font-size: 26px;
      margin-bottom: 22px;
    }

    .journal-form {
      display: grid;
      gap: 17px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .journal-form input,
    .journal-form select,
    .journal-form textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid #d7dee8;
      border-radius: 10px;
      background: #fbfcfe;
      color: #142033;
      font: inherit;
      box-sizing: border-box;
    }

    .journal-form textarea {
      min-height: 125px;
      resize: vertical;
    }

    .save-button {
      padding: 16px 22px;
      background: #20d99f;
      color: #06241c;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-message {
      font-weight: 700;
      color: #087c5a;
    }

    .history-section {
      background: #0b1420;
      color: #fff;
      padding: 65px 5%;
    }

    .history-inner {
      max-width: 1100px;
      margin: auto;
    }

    .history-inner > p {
      color: #aebbc8;
      margin-bottom: 25px;
    }

    .trade-card {
      background: #111e2b;
      border: 1px solid #293a49;
      border-radius: 15px;
      padding: 24px;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }

    .trade-card h3 {
      color: #28d7b0;
      margin: 8px 0 14px;
    }

    .trade-card p {
      color: #d0d9e2;
      margin: 7px 0;
    }

    .delete-button {
      margin-top: 16px;
      padding: 11px 16px;
      border: 1px solid #728092;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .privacy-note {
      background: #132332;
      border-left: 4px solid #28d7b0;
      padding: 18px;
      border-radius: 8px;
      color: #d4dee8;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      .brand-logo {
        width: 60px;
        height: 60px;
      }

      .brand-tagline {
        font-size: 10px;
      }
